# Link layout for the resident player MPLAY (BRUN MPLAY installs the & MPLAY command).
# The numbers repeat src/mb_apple2/mb_layout.inc; .assert lines in mb_basic.s check them.
#   $6900-$78FF  ring of 4 slots     $7900-$79FF  its tail copy
#   $7A00-$7AFF  sector buffer       $7B00-$7CFF  variables
#   $7D00-$89FF  the file: code, just under KBASIC ($8A00)
MEMORY {
    ZP:     file = "",  start = $00FA, size = $0005, type = rw;
    RINGM:  file = "",  start = $6900, size = $1000, type = rw;
    TAILM:  file = "",  start = $7900, size = $0100, type = rw;
    SECM:   file = "",  start = $7A00, size = $0100, type = rw;
    VARS:   file = "",  start = $7B00, size = $0200, type = rw;
    MAIN:   file = %O,  start = $7D00, size = $0D00;
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    RING:     load = RINGM, type = bss, define = yes;
    TAIL:     load = TAILM, type = bss;
    SECBUF:   load = SECM,  type = bss, define = yes;
    BSS:      load = VARS,  type = bss, define = yes;
    CODE:     load = MAIN,  type = ro;
    RODATA:   load = MAIN,  type = ro;
}
