# Link layout for the Applesoft & MPLAY command.
#   $6000-$80FF  the song (a file BLOADed here, or a compiled tune); BASIC's HIMEM is $6000
#   $8100-$8BFF  variables
#   $8C00-$95FF  code: just under DOS 3.3's buffers (CALL 35840 installs the command)
MEMORY {
    ZP:   file = "",  start = $00FA, size = $0005, type = rw;
    MAIN: file = %O,  start = $8C00, size = $0A00;
    BSS:  file = "",  start = $8100, size = $0B00, type = rw;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    BSS:      load = BSS,  type = bss;
}
