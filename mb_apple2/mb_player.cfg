# Link layout for the standalone player.
#   $1000-$7FFF  song, or the 7-track ring (loaded by the player)
#   $8000-$803F  copy of the ring's first bytes, so a frame can run over the ring end
#   $8100-$81FF  driver and streamer variables
#   $8200-$82FF  the sector buffer for the catalog and track/sector lists
#   $8E00-$95FF  code: just under DOS 3.3's buffers (the menu sets HIMEM:36352)
MEMORY {
    ZP:   file = "",  start = $00FA, size = $0005, type = rw;
    MAIN: file = %O,  start = $8E00, size = $0800;
    BSS:  file = "",  start = $8100, size = $0100, type = rw;
    SECBUF: file = "", start = $8200, size = $0100, type = rw;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    BSS:      load = BSS,  type = bss;
    SECBUF:   load = SECBUF, type = bss;
}
